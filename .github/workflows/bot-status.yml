name: Check bot/service status

on:
  # 2026-08-25: fires immediately when the LXC's timer pushes fresh
  # bot_state.json/bot_log.jsonl -- fast reaction to the primary
  # publisher instead of waiting for the next poll.
  push:
    branches: [main]
    paths:
      - "bot_state.json"
      - "bot_log.jsonl"
      - "bot_history/**"
  # External cron also calls workflow_dispatch on its own schedule --
  # this is what actually detects the LXC going silent: lxc-monitor
  # staleness detection (see check_bot_status.py's IS_CI branch) needs
  # an INDEPENDENT run happening even when the LXC ISN'T pushing.
  # Dropping this trigger would silently remove that detection.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # brokers.json is a static, rarely-changing list of broker
      # hostnames (used only for the DNS-failover-target note, via its
      # own live DNS resolution -- see check_bot_status.py's
      # _current_failover_target()). Kept as our own copy here rather
      # than a cross-repo checkout, since it doesn't need to be
      # perfectly fresh, just present.
      - run: python3 check_bot_status.py
      - name: Skip publish if the LXC already did recently
        id: guard
        run: |
          last_author=$(git log -1 --format='%an')
          last_ts=$(git log -1 --format='%at')
          now=$(date +%s)
          age=$((now - last_ts))
          if [ "$last_author" = "bot-status-lxc" ] && [ "$age" -lt 300 ]; then
            echo "LXC published ${age}s ago -- skipping, it's already current"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push if changed
        if: steps.guard.outputs.skip != 'true'
        env:
          TZ: Asia/Jakarta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot-status.html bot_history bot_state.json bot_log.jsonl
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "Update status $(date +%Y-%m-%dT%H:%M:%S%z) WIB"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "failed to push after 3 attempts"
          exit 1
