name: Check bot/service status

on:
  # 2026-09-04: replaces the old push-trigger + external-workflow_dispatch-
  # cron + "skip if the LXC already published" guard -- that whole dance
  # existed because the real check used to run on the LXC and push its
  # own results, with this workflow only able to infer staleness from
  # commit timing when it hadn't. Now this workflow IS the only check --
  # it polls the bot's own public API (meshbot.rivi.my.id) directly, so
  # a plain schedule is enough. Every 10 minutes (GitHub's actual
  # scheduling has queueing delay under load, so this is a target, not
  # a guarantee).
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_bot_status.py
      - name: Commit and push if changed
        env:
          TZ: Asia/Jakarta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot-status.html bot_history bot_state.json bot_log.jsonl
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "Update status $(date +%Y-%m-%dT%H:%M:%S%z) WIB"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "failed to push after 3 attempts"
          exit 1
